// ---- iso projection (2:1 diamond) ----
const TW=64,TH=32,HW=TW/2,HH=TH/2,WALLH=26;
const cam={x:0,y:0};
function iso(cx,cy){return {x:(cx-cy)*HW,y:(cx+cy)*HH};}            // cell-space -> iso world
function isoToCell(sx,sy){const X=sx+cam.x,Y=sy+cam.y;return {cx:(X/HW+Y/HH)/2, cy:(Y/HH-X/HW)/2};}

// ---- dungeon: wide maze (2-cell corridors) + rooms ----
const COLS=45,ROWS=45;

const rooms=[];
function carveRoom(x,y,w,h){for(let r=y;r<y+h;r++)for(let c=x;c<x+w;c++)if(r>0&&c>0&&r<ROWS-1&&c<COLS-1)grid[r][c]=1;}
(function(){
  const CN=Math.floor((COLS-2)/3),RN=Math.floor((ROWS-2)/3); // coarse maze: each cell -> 2 wide floor + 1 wall
  function block(ci,cj){const x=1+3*ci,y=1+3*cj;for(let r=0;r<2;r++)for(let c=0;c<2;c++)if(y+r<ROWS-1&&x+c<COLS-1)grid[y+r][x+c]=1;}
  function bridge(ci,cj,ci2,cj2){const x=1+3*Math.min(ci,ci2),y=1+3*Math.min(cj,cj2);if(ci!==ci2){for(let r=0;r<2;r++)grid[y+r][x+2]=1;}else{for(let c=0;c<2;c++)grid[y+2][x+c]=1;}}
  const vis=[];for(let j=0;j<RN;j++)vis.push(new Array(CN).fill(false));
  block(0,0);vis[0][0]=true;const st=[[0,0]],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(st.length){const [ci,cj]=st[st.length-1];const opts=[];for(const[dc,dr]of dirs){const ni=ci+dc,nj=cj+dr;if(ni>=0&&nj>=0&&ni<CN&&nj<RN&&!vis[nj][ni])opts.push([ni,nj]);}

  for(let i=0;i<6;i++){const w=5+(Math.random()*4|0),h=4+(Math.random()*3|0),x=1+(Math.random()*(COLS-w-2)|0),y=1+(Math.random()*(ROWS-h-2)|0);carveRoom(x,y,w,h);rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});}
})();
const walkCells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===1)walkCells.push({c,r});
function floorAt(c,r){return r>=0&&c>=0&&r<ROWS&&c<COLS&&grid[r][c]===1;}
function randWalk(){return walkCells[(Math.random()*walkCells.length)|0];}

// ---- combat ----
function dmgMob(m,d,fromFace){d*=(player.atkBuff||1);var __cr=(player._imp&&player._imp.critRate!=null)?player._imp.critRate:.2;var __cm=(player._imp&&player._imp.critMult)?player._imp.critMult:1.8;const crit=Math.random()<(__cr+(player.critBuff||0));d=Math.round(d*(.85+Math.random()*.3)*(crit?__cm:1));m.hp-=d;m.hf=.16;const ang=fromFace!==undefined?fromFace:Math.atan2(m.cy-player.cy,m.cx-player.cx);m.kbx=(m.kbx||0)+Math.cos(ang)*(crit?17:11);m.kby=(m.kby||0)+Math.sin(ang)*(crit?17:11)*.5;popText(m.cx,m.cy-.55,fmt(d),crit?'#ffd23a':'#fff',crit);spark(m.cx,m.cy-.4,crit);shake(crit?9:5);hitstop=Math.max(hitstop,crit?.09:.05);sfx.hit(d,crit);if(m.hp<=0){m.dead=1;kills++;popText(m.cx,m.cy,'+'+fmt(m.t.g*7),'#ffce3a');burst(m.cx,m.cy,m.t.c);sfx.die();if(player.target===m)player.target=null;_vroll(m);}}
function dmgPlayer(d){if(player.dead)return;if(player._imp){d=Math.max(1,(d-(player._imp.drFlat||0)))*(player._imp.physMitig||1);}d=Math.round(d*(1-(player.defBuff||0)));player.hp-=d;player.hf=.16;popText(player.cx,player.cy-.7,fmt(d),'#ff7a7a');shake(5);hitstop=Math.max(hitstop,.04);sfx.hurt();if(player.hp<=0){player.hp=0;player.dead=1.8;sfx.die();toast('你倒下了…復活中');}}
function fireArrow(tg){const ang=Math.atan2(tg.cy-player.cy,tg.cx-player.cx);arrows.push({x:player.cx,y:player.cy,vx:Math.cos(ang),vy:Math.sin(ang),ang:ang,dmg:player.atk,dist:0});}

// ---- movement (cell space) ----
function follow(ent,spd,dt){if(!ent.path||ent.pi>=ent.path.length){ent.path=null;return true;}const wp=ent.path[ent.pi],dx=wp.cx-ent.cx,dy=wp.cy-ent.cy,d=Math.hypot(dx,dy);if(d<.08){ent.pi++;return ent.pi>=ent.path.length;}const s=Math.min(d,spd*dt);ent.cx+=dx/d*s;ent.cy+=dy/d*s;ent.face=Math.atan2(dy,dx);ent.moving=true;ent.walkT=(ent.walkT||0)+dt;return false;}
function toward(ent,tx,ty,spd,dt){const dx=tx-ent.cx,dy=ty-ent.cy,d=Math.hypot(dx,dy);if(d<.02)return;const s=Math.min(d,spd*dt),nx=ent.cx+dx/d*s,ny=ent.cy+dy/d*s;if(floorAt(nx|0,ny|0)){ent.cx=nx;ent.cy=ny;ent.face=Math.atan2(dy,dx);ent.moving=true;ent.walkT=(ent.walkT||0)+dt;}}

// ---- fog ----
function los(c0,r0,c1,r1){let x=c0,y=r0;const dx=Math.abs(c1-c0),dy=Math.abs(r1-r0),sx=c0<c1?1:-1,sy=r0<r1?1:-1;let err=dx-dy;while(true){if(!(x===c0&&y===r0)&&!floorAt(x,y))return(x===c1&&y===r1);if(x===c1&&y===r1)return true;const e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}}
function vision(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)visible[r][c]=false;const pc=player.cx|0,pr=player.cy|0,R=Math.ceil(VIS);
  for(let dr=-R;dr<=R;dr++)for(let dc=-R;dc<=R;dc++){const c=pc+dc,r=pr+dr;if(r<0||c<0||r>=ROWS||c>=COLS)continue;if(Math.hypot(dc,dr)>VIS)continue;if(los(pc,pr,c,r)){visible[r][c]=true;explored[r][c]=true;}}}

// ---- update ----
let last=performance.now();
function update(dt){
  tickBuffs(dt);
  skills.forEach(s=>{if(s.t>0){s.t-=dt;if(s.t<0)s.t=0;}});
  if(player.dead){player.dead-=dt;if(player.dead<=0){player.cx=start.cx+.5;player.cy=start.cy+.5;player.hp=player.mhp;player.dead=0;player.path=null;player.target=null;}}
  else{player.atkT-=dt;player.hf-=dt;player.moving=false;if(player.atkAnim>0)player.atkAnim-=dt;
    if(autoBattle){
      // manual click-to-move ALWAYS works in auto mode
      if(player.path)follow(player,player.spd,dt);
      // auto-aim nearest mob within 13, attack in range, NEVER auto-move / NEVER cancel move path
      let b=null,bd=1e9;for(const mm of mobs){if(mm.dead)continue;const dd=dist(player,mm);if(dd<bd){bd=dd;b=mm;}}
      const tg=(b&&bd<=13)?b:null;player.target=tg;
      if(tg){
        if(player.spr==='elf'||player.spr==='felf'){
          if(bd<=12&&los(player.cx|0,player.cy|0,tg.cx|0,tg.cy|0)){player.face=Math.atan2(tg.cy-player.cy,tg.cx-player.cx);autoCastCombat();if(player.atkT<=0){player.atkAnim=.45;sfx.swing();fireArrow(tg);player.atkT=player.atkCd;}}
        } else {
          if(bd<=player.range){player.face=Math.atan2(tg.cy-player.cy,tg.cx-player.cx);autoCastCombat();if(player.atkT<=0){player.atkAnim=.45;sfx.swing();dmgMob(tg,player.atk,player.face);player.atkT=player.atkCd;}}
        }
      }
    } else {
      const tg=player.target;
      if(tg&&!tg.dead){const d=dist(player,tg);
        if(player.spr==='elf'||player.spr==='felf'){
          const seeTg=los(player.cx|0,player.cy|0,tg.cx|0,tg.cy|0);
          if(d<=12&&seeTg){player.path=null;player.face=Math.atan2(tg.cy-player.cy,tg.cx-player.cx);autoCastCombat();if(player.atkT<=0){player.atkAnim=.45;sfx.swing();fireArrow(tg);player.atkT=player.atkCd;}}
          else{if(player.path)follow(player,player.spd,dt);else{player.path=bfs(player.cx|0,player.cy|0,tg.cx|0,tg.cy|0);player.pi=0;}}
        } else {
          if(d>player.range){if(player.path)follow(player,player.spd,dt);else{player.path=bfs(player.cx|0,player.cy|0,tg.cx|0,tg.cy|0);player.pi=0;}}
          else{player.path=null;player.face=Math.atan2(tg.cy-player.cy,tg.cx-player.cx);autoCastCombat();if(player.atkT<=0){player.atkAnim=.45;sfx.swing();dmgMob(tg,player.atk,Math.atan2(tg.cy-player.cy,tg.cx-player.cx));player.atkT=player.atkCd;}}
        }
      }
      else if(player.path)follow(player,player.spd,dt);
    }
  }
  const pIso=iso(player.cx,player.cy);cam.x=pIso.x-W/2;cam.y=pIso.y-H/2;
  vision();
  chestArr.forEach(ch=>{if(!ch.opened&&dist(ch,player)<.8){ch.opened=1;chests++;const _bid=Math.random()<.30?'secret_box_t4':'secret_box_t3';INV[_bid]=(INV[_bid]||0)+1;_postLoot();const _it=ITEMDB[_bid];popText(ch.cx,ch.cy-.4,'獲得 '+_it.n,TIERC[_it.t],true);ring(ch.cx,ch.cy,1.1,TIERC[_it.t]);sfx.gold();toast('寶箱開啟：'+_it.n+'（30轉）');var __gl=3;try{__gl=(EXPLORE_RULES[EXPLORE_MAP_ID]&&EXPLORE_RULES[EXPLORE_MAP_ID].chestGoal)||3;}catch(e){}if(chests>=__gl)dungeonComplete();}});
  spawnT-=dt;if(spawnT<=0){spawnT=2;let _al=0;for(const _m of mobs)if(!_m.dead&&!_m.t.boss)_al++;if(_al<MOB_CAP){for(let _s=0;_s<5;_s++){const w=randWalk();if(w&&Math.hypot(w.c+.5-player.cx,w.r+.5-player.cy)>5){mobs.push({t:MT[0],cx:w.c+.5,cy:w.r+.5,hp:MT[0].hp,mhp:MT[0].hp,atkT:0,hf:0,wa:0,wt:0,dead:0,dt:0});ring(w.c+.5,w.r+.5,1.0,'#b39ddb');}}}}
  for(let i=drops.length-1;i>=0;i--){const dp=drops[i];dp.tt+=dt;if(dist(dp,player)<.85){INV[dp.id]=(INV[dp.id]||0)+1;_postLoot();const _it=ITEMDB[dp.id];popText(dp.cx,dp.cy-.4,_it.n,TIERC[_it.t]);sfx.gold();drops.splice(i,1);continue;}if(dp.tt>45)drops.splice(i,1);}
  mobs.forEach(m=>{if(m.dead){m.dt+=dt;return;}m.atkT-=dt;m.hf-=dt;m.moving=false;if(m.atkAnim>0)m.atkAnim-=dt;m.kbx=(m.kbx||0)*.82;m.kby=(m.kby||0)*.82;const d=dist(m,player);const seen=visible[m.cy|0]&&visible[m.cy|0][m.cx|0];
    if(!player.dead&&d<m.t.aggro&&seen){if(d>m.t.range)toward(m,player.cx,player.cy,m.t.spd,dt);else if(m.atkT<=0){dmgPlayer(m.t.atk*(.85+Math.random()*.3));m.atkT=1.1;m.atkAnim=.45;}}
    else{m.wt-=dt;if(m.wt<=0){m.wt=1.5+Math.random()*2;m.wa=Math.random()*7;}toward(m,m.cx+Math.cos(m.wa)*.6,m.cy+Math.sin(m.wa)*.6,m.t.spd*.4,dt);}});
  for(let i=mobs.length-1;i>=0;i--)if(mobs[i].dead&&mobs[i].dt>.3)mobs.splice(i,1);
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.t+=dt;s.cx+=s.vx*dt;s.cy+=s.vy*dt;let hit=false;for(const m of mobs)if(!m.dead&&dist(m,s)<.5){dmgMob(m,s.dmg);hit=true;break;}if(hit||s.t>s.life||!floorAt(s.cx|0,s.cy|0)){ring(s.cx,s.cy,.6,'#ffae4d');shots.splice(i,1);}}
  for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];const sp=16*dt,steps=Math.max(1,Math.ceil(sp/0.2));let done=false;
    for(let s2=0;s2<steps&&!done;s2++){a.x+=a.vx*(sp/steps);a.y+=a.vy*(sp/steps);a.dist+=sp/steps;
      if(!floorAt(a.x|0,a.y|0)){spark(a.x,a.y,false);done=true;break;}               // 撞牆消失，不穿透
      for(const m of mobs){if(m.dead)continue;if(Math.hypot(m.cx-a.x,m.cy-a.y)<.5){dmgMob(m,a.dmg,a.ang);done=true;break;}}
      if(a.dist>13)done=true;
    }
    if(done)arrows.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.cy+=f.vy*dt;if(f.t>f.life)floats.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>rings[i].life)rings.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.cx+=q.vx*dt;q.cy+=q.vy*dt;if(q.t>q.life)parts.splice(i,1);}
  if(player.moveMark)player.moveMark.t+=dt;
  if(shT>0){shT-=dt;if(shT<=0)shM=0;}
}

// ---- render ----
function diamond(sx,sy){ctx.beginPath();ctx.moveTo(sx,sy-HH);ctx.lineTo(sx+HW,sy);ctx.lineTo(sx,sy+HH);ctx.lineTo(sx-HW,sy);ctx.closePath();}
function drawSprite(ent,imgKey,hgt,flash,face,targeted,col){const p=iso(ent.cx,ent.cy),gx=p.x-cam.x,gy=p.y-cam.y,sx=gx+(ent.kbx||0),sy=gy+(ent.kby||0);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(gx,gy,hgt*0.32,hgt*0.15,0,0,7);ctx.fill();
  const t=performance.now()/1000,faceLeft=Math.cos(face||0)<0;let bob,sq,lean=0,lunge=0;
  if(ent.moving){const ph=(ent.walkT||0)*9;bob=-Math.abs(Math.sin(ph))*hgt*0.10;lean=Math.sin(ph)*0.10;sq=1+Math.sin(ph*2)*0.05;}
  else{bob=Math.sin(t*2.2)*hgt*0.02;sq=1+Math.sin(t*2.2)*0.02;}
  if(ent.atkAnim>0){const k=1-ent.atkAnim/0.45;lunge=Math.sin(k*Math.PI)*hgt*0.30;}
  const lx=Math.cos(face||0)*lunge,ly=Math.sin(face||0)*lunge*0.5;
  const im=IMG[imgKey];
  ctx.save();ctx.translate(sx+lx,sy+ly+bob);ctx.rotate(lean*(faceLeft?-1:1));if(faceLeft)ctx.scale(-1,1);ctx.scale(1,sq);
  if(im&&im.complete&&im.naturalWidth){const ar=im.naturalWidth/im.naturalHeight,dh=hgt,dw=dh*ar;ctx.drawImage(im,-dw/2,-dh+5,dw,dh);if(flash>0){ctx.globalAlpha=.55;ctx.globalCompositeOperation='lighter';ctx.drawImage(im,-dw/2,-dh+5,dw,dh);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}}
  else{ctx.fillStyle=flash>0?'#fff':(col||'#888');ctx.beginPath();ctx.arc(0,-hgt*.4,hgt*.36,0,7);ctx.fill();}
  ctx.restore();
  if(ent.atkAnim>0){const k=1-ent.atkAnim/0.45;ctx.save();ctx.translate(sx+Math.cos(face||0)*hgt*0.35,sy-hgt*0.45+Math.sin(face||0)*hgt*0.18);ctx.globalAlpha=Math.sin(k*Math.PI)*0.85;ctx.strokeStyle='#fff';ctx.lineWidth=3;const a0=(face||0)-0.9+k*1.9;ctx.beginPath();ctx.arc(0,0,hgt*0.5,a0,a0+0.55);ctx.stroke();ctx.globalAlpha=1;ctx.restore();}
  if(targeted){ctx.strokeStyle='#ffce3a';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(sx,sy,hgt*.4,hgt*.2,0,0,7);ctx.stroke();}
  return {sx,sy};
}
function lighten(hex){return hex;} // keep simple
var DIR8=[4,5,6,7,0,1,2,3];
function faceToDir(face){var a=(((face||0)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);var oct=Math.round(a/(Math.PI/4))%8;return DIR8[oct];}
function drawReal(ent,key,face,scale,flash,targeted){
  var meta=window.SPRITES[key],im=window.SPRImg[key];
  var p=iso(ent.cx,ent.cy),gx=p.x-cam.x,gy=p.y-cam.y,sx=gx+(ent.kbx||0),sy=gy+(ent.kby||0);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(gx,gy,meta.CW*scale*0.24,meta.CW*scale*0.11,0,0,7);ctx.fill();
  var dir=faceToDir(face),anim='walk',frame=0;
  if(ent.atkAnim>0&&meta.anims.attack){anim='attack';var k=1-ent.atkAnim/0.45;frame=Math.floor(k*meta.anims.attack.frames);}
  else if(ent.moving){frame=Math.floor((ent.walkT||0)*8)%meta.anims.walk.frames;}   // 自然走路(act0)
  else if(meta.anims.attack){anim='attack';frame=0;}     // 待機持劍待命(act4第0格)
  var am=meta.anims[anim];if(!am){am=meta.anims.walk;anim='walk';}
  if(frame>=am.frames)frame=am.frames-1;if(frame<0)frame=0;
  var ax=frame*meta.CW,ay=(am.row*8+dir)*meta.CH;
  var dw=meta.CW*scale,dh=meta.CH*scale,dx=sx-meta.AX*scale,dy=sy-meta.AY*scale;
  var lx=0,ly=0;
  if(im&&im.complete&&im.naturalWidth){
    ctx.drawImage(im,ax,ay,meta.CW,meta.CH,dx+lx,dy+ly,dw,dh);
    if(flash>0){ctx.save();ctx.globalAlpha=Math.min(.7,flash*4.2);ctx.globalCompositeOperation='lighter';ctx.drawImage(im,ax,ay,meta.CW,meta.CH,dx+lx,dy+ly,dw,dh);ctx.restore();}
  } else {ctx.fillStyle=flash>0?'#fff':'#789';ctx.beginPath();ctx.arc(sx,sy-dh*0.4,dh*0.3,0,7);ctx.fill();}
  if(targeted){ctx.strokeStyle='#ffce3a';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(gx,gy,meta.CW*scale*0.26,meta.CW*scale*0.13,0,0,7);ctx.stroke();}
}

function drawHero(ent,H,face,targeted){
  const p=iso(ent.cx,ent.cy),gx=p.x-cam.x,gy=p.y-cam.y,sx=gx+(ent.kbx||0),sy=gy+(ent.kby||0);
